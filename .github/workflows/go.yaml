name: Go

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Get dependencies
        run: go get -v -t ./...
      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
